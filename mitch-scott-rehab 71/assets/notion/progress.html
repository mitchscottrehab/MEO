<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Momentum progress</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#fb452f;--bg:#1f1f1f;--ink:#f4f1ec;--mute:#8a857d;--lock:#4a4743}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,Helvetica,Arial,sans-serif}
  .wrap{box-sizing:border-box;height:100vh;padding:14px 16px}
  svg{display:block;width:100%;height:100%;overflow:visible}
  .lbl{font-weight:600;fill:var(--ink)}
  .sub{fill:var(--mute)}
  .locked .lbl{fill:var(--lock)}
  .locked .sub{fill:var(--lock)}
  .goal{font-weight:700;fill:var(--red)}
  .tag{fill:var(--mute);font-weight:500}
  .kh{fill:var(--ink);font-weight:600}
  .kt{fill:var(--ink);font-weight:500}
  .locked .tag{fill:var(--lock)}
  .here{font-weight:600;fill:var(--ink)}
</style>
</head>
<body>
<div class="wrap"><svg id="c" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Momentum progress"></svg></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function g(k,d){return (q.get(k)||d||'').trim()}
  function lines(v){return v?v.split(';').map(function(x){return x.trim()}).filter(Boolean):[]}
  var phase=Math.max(1,Math.min(4,parseInt(g('phase','1'),10)||1)); // 4 = goal reached
  var now=Math.max(0,Math.min(100,parseFloat(g('now','40'))))/100;
  var focus=[g('p1'),g('p2'),g('p3')];
  var tg=[[],lines(g('t1')),lines(g('t2')),lines(g('t3'))]; // targets for phase 1-3
  var at=g('at').split(';').map(function(x){return x.trim()}); // current scores, same order as the phase's targets
  var goal=g('goal','Your goal');
  var ns='http://www.w3.org/2000/svg', svg=document.getElementById('c');
  var k=Math.max(1,760/Math.max(280,(svg.parentNode.clientWidth||760)-32)); // keeps text readable in narrow embeds
  var fs={lbl:13,sub:11,goal:14,here:12,kh:13,kt:12,kc:12};
  function el(t,a,txt,parent){var e=document.createElementNS(ns,t);for(var key in a)e.setAttribute(key,a[key]);if(txt!=null){e.textContent=txt;var c=a['class'];if(fs[c])e.setAttribute('font-size',fs[c]*k)}(parent||svg).appendChild(e);return e}
  var lh=17*k, TOP=30+18*k, BASE=TOP+190;
  var C=[20,260,500,740];                            // Phase 1 | Phase 2 | Phase 3
  var X=[40,260,500,715], Y=[BASE-18,BASE-78,BASE-138,TOP];
  var anyFocus=focus.some(Boolean);
  var LY=BASE+20*k, SY=LY+15*k, KY=(anyFocus?SY:LY)+30*k;
  var cp=Math.min(phase,3), keys=tg[cp];
  var VH=Math.round(keys.length?KY+keys.length*lh+10*k:(anyFocus?SY:LY)+10*k);
  svg.setAttribute('viewBox','0 0 760 '+VH);
  el('line',{x1:20,y1:BASE,x2:740,y2:BASE,stroke:'#2e2c2a','stroke-width':1});
  el('line',{x1:20,y1:Y[3],x2:740,y2:Y[3],stroke:'#fb452f','stroke-opacity':.35,'stroke-width':1,'stroke-dasharray':'3 5'});
  for(var i=0;i<3;i++){
    var x1=X[i],y1=Y[i],x2=X[i+1],y2=Y[i+1], n=i+1;
    var done=n<phase, cur=n===phase, locked=n>phase;
    var gr=el('g',{'class':locked?'locked':''});
    el('rect',{x:C[i],y:TOP-14,width:C[i+1]-C[i],height:BASE-TOP+14,fill:cur?'#fb452f':'#ffffff','fill-opacity':cur?.06:(locked?0:.02)},null,gr);
    if(locked){
      el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:'var(--lock)','stroke-width':2.2*k,'stroke-dasharray':(5*k)+' '+(6*k),'stroke-linecap':'round'},null,gr);
      var lx=(x1+x2)/2+16*k, ly=(y1+y2)/2+6*k;
      el('g',{transform:'translate('+lx+','+ly+') scale('+k+')'},null,gr).innerHTML='<rect x="-8" y="0" width="16" height="12" rx="2.5" fill="#4a4743"/><path d="M-5 0 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#4a4743" stroke-width="2"/>';
    } else if(done){
      el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:'var(--red)','stroke-width':3*k,'stroke-linecap':'round'},null,gr);
    } else {
      var hx=x1+(x2-x1)*now, hy=y1+(y2-y1)*now;
      el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:'var(--red)','stroke-opacity':.3,'stroke-width':2.2*k,'stroke-dasharray':(5*k)+' '+(6*k),'stroke-linecap':'round'},null,gr);
      el('line',{x1:x1,y1:y1,x2:hx,y2:hy,stroke:'var(--red)','stroke-width':3*k,'stroke-linecap':'round'},null,gr);
      el('circle',{cx:hx,cy:hy,r:10*k,fill:'var(--red)','fill-opacity':.2},null,gr);
      el('circle',{cx:hx,cy:hy,r:5*k,fill:'var(--red)',stroke:'var(--bg)','stroke-width':2},null,gr);
      el('text',{x:hx,y:hy-14*k,'text-anchor':'middle','class':'here'},"You're here",gr);
    }
    if(i<2) el('circle',{cx:x2,cy:y2,r:4*k,fill:locked?'var(--lock)':'var(--red)'},null,gr);
    var cx=(C[i]+C[i+1])/2;
    el('text',{x:cx,y:LY,'text-anchor':'middle','class':'lbl'},'Phase '+n+(k>1.4?'':(locked?'  ·  locked':(done?'  ·  done':''))),gr);
    if(focus[i]) el('text',{x:cx,y:SY,'text-anchor':'middle','class':'sub'},focus[i],gr);
  }
  el('circle',{cx:X[0],cy:Y[0],r:4*k,fill:'var(--red)'});
  var gx=X[3], gy=Y[3];
  el('line',{x1:gx,y1:gy,x2:gx,y2:gy-30,stroke:phase>3?'var(--red)':'var(--ink)','stroke-width':2});
  el('path',{d:'M'+gx+' '+(gy-30)+' l18 6 l-18 6 z',fill:'var(--red)'});
  el('text',{x:gx-8*k,y:gy-14,'text-anchor':'end','class':'goal'},goal);
  // key targets for the current phase
  if(keys.length){
    el('text',{x:20,y:KY,'class':'kh'},phase>3?'Key targets reached':'Key targets for Phase '+cp);
    keys.forEach(function(t,j){
      var y=KY+(j+1)*lh, tx=el('text',{x:20,y:y,'class':'kt','font-size':fs.kt*k});
      var b=document.createElementNS(ns,'tspan');b.setAttribute('fill','#fb452f');b.textContent='•  ';tx.appendChild(b);
      var m=document.createElementNS(ns,'tspan');m.textContent=t;tx.appendChild(m);
      if(at[j]){var c=document.createElementNS(ns,'tspan');c.setAttribute('class','kc');c.setAttribute('fill','#8a857d');c.textContent='  (you currently = '+at[j]+')';tx.appendChild(c);}
    });
  }
})();
</script>
</body>
</html>
