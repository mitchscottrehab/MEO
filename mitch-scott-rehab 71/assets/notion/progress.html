<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Momentum progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1b1a; --ink:#f4f1ec; --ink2:#c9c4bb; --mute:#8a857d; --faint:#55514b;
    --rule:#2d2b29; --red:#fb452f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,Helvetica,Arial,sans-serif;
    font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
  html,body{height:100%;overflow:hidden}
  .card{height:100%;display:flex;flex-direction:column;padding:20px 24px 16px}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:16px}
  .stage{font-size:12px;color:var(--mute);white-space:nowrap}
  .stage b{color:var(--ink);font-weight:600}
  .goal{font-size:12px;color:var(--mute);text-align:right}
  .goal b{color:var(--red);font-weight:600;font-size:13px}
  .chart{position:relative;flex:1 1 auto;min-height:48px;max-height:170px}
  .chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .phases{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px}
  .ph{padding:9px 0 0;border-top:1px solid var(--rule)}
  .ph + .ph{padding-left:12px}
  .ph .n{font-size:13px;font-weight:600;color:var(--ink)}
  .ph .f{font-size:12px;color:var(--mute);margin-top:2px}
  .ph.cur{border-top:2px solid var(--red);padding-top:8px}
  .ph.lock .n,.ph.lock .f{color:var(--faint)}
  .ph.done .n::after{content:" \2713";color:var(--red)}
  .keys{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
  .keys h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink)}
  .keys ul{list-style:none;margin:0;padding:0}
  .keys li{position:relative;padding:4px 0 4px 15px;font-size:13px;line-height:1.45;color:var(--ink)}
  .keys li::before{content:"";position:absolute;left:1px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--red)}
  .keys li span{color:var(--mute)}
  @media (max-width:460px){
    .card{padding:16px 18px 12px}
    .top{margin-bottom:10px}
    .phases{margin-top:8px}
    .ph{padding-top:7px}.ph.cur{padding-top:6px}
    .keys{margin-top:12px;padding-top:11px}
    .keys h3{margin-bottom:3px}
    .keys li{padding:2px 0 2px 15px}.keys li::before{top:9px}
    .ph + .ph{padding-left:8px}
    .ph .f{font-size:11px}
  }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="stage" id="stage"></div>
    <div class="goal" id="goal"></div>
  </div>
  <div class="chart" id="chart"></div>
  <div class="phases" id="phases"></div>
  <div class="keys" id="keys" hidden><h3 id="kh"></h3><ul id="kl"></ul></div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function g(k,d){return (q.get(k)||d||'').trim()}
  function list(v){return v?v.split(';').map(function(x){return x.trim()}):[]}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var phase=Math.max(1,Math.min(4,parseInt(g('phase','1'),10)||1)); // 4 = goal reached
  var now=Math.max(0,Math.min(100,parseFloat(g('now','40'))))/100;
  var focus=[g('p1'),g('p2'),g('p3')];
  var tg=[null,list(g('t1')).filter(Boolean),list(g('t2')).filter(Boolean),list(g('t3')).filter(Boolean)];
  var at=list(g('at'));
  var goal=g('goal','Your goal');

  document.getElementById('stage').innerHTML = phase>3 ? '<b>Goal reached</b>' : '<b>Phase '+phase+'</b> of 3';
  document.getElementById('goal').innerHTML = 'Goal&nbsp; <b>'+esc(goal)+'</b>';

  var html='';
  for(var i=1;i<=3;i++){
    var cls=i<phase?'done':(i===phase?'cur':'lock');
    html+='<div class="ph '+cls+'"><div class="n">Phase '+i+'</div>'+(focus[i-1]?'<div class="f">'+esc(focus[i-1])+'</div>':'')+'</div>';
  }
  document.getElementById('phases').innerHTML=html;

  var cp=Math.min(phase,3), keys=tg[cp];
  if(keys.length){
    document.getElementById('keys').hidden=false;
    document.getElementById('kh').textContent = phase>3 ? 'Key targets reached' : 'Key targets for Phase '+cp;
    document.getElementById('kl').innerHTML = keys.map(function(t,j){
      return '<li>'+esc(t)+(at[j]?' <span>(currently = '+esc(at[j])+')</span>':'')+'</li>';
    }).join('');
  }

  var box=document.getElementById('chart');
  function draw(){
    var W=box.clientWidth, H=box.clientHeight;
    var pad=4, y0=H-6, y3=8;
    var xs=[pad, W/3, 2*W/3, W-7];
    var ys=[y0, y0-(y0-y3)*0.24, y0-(y0-y3)*0.58, y3];
    var p=phase>3?1:((phase-1)+now)/3;
    function pt(t){var s=Math.min(2,Math.floor(t*3)),f=t*3-s;if(t>=1){s=2;f=1}return [xs[s]+(xs[s+1]-xs[s])*f, ys[s]+(ys[s+1]-ys[s])*f, s]}
    var c=pt(p);
    var full='M'+xs.map(function(x,i){return x+' '+ys[i]}).join(' L');
    var done='M'+xs[0]+' '+ys[0]; for(var s=0;s<c[2];s++) done+=' L'+xs[s+1]+' '+ys[s+1]; done+=' L'+c[0]+' '+c[1];
    var area=done+' L'+c[0]+' '+H+' L'+xs[0]+' '+H+' Z';
    var lx=Math.max(34,Math.min(W-34,c[0]));
    box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'">'+
      '<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb452f" stop-opacity=".2"/><stop offset="1" stop-color="#fb452f" stop-opacity="0"/></linearGradient></defs>'+
      '<line x1="'+xs[1]+'" y1="0" x2="'+xs[1]+'" y2="'+H+'" stroke="#2d2b29"/>'+
      '<line x1="'+xs[2]+'" y1="0" x2="'+xs[2]+'" y2="'+H+'" stroke="#2d2b29"/>'+
      '<line x1="0" y1="'+y3+'" x2="'+W+'" y2="'+y3+'" stroke="#fb452f" stroke-opacity=".3" stroke-dasharray="2 4"/>'+
      '<path d="'+area+'" fill="url(#fade)"/>'+
      '<path d="'+full+'" fill="none" stroke="#3a3835" stroke-width="1.5" stroke-linejoin="round"/>'+
      '<path d="'+done+'" fill="none" stroke="#fb452f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      [1,2].map(function(i){var hit=p>=i/3-1e-6;return '<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="3" fill="'+(hit?'#fb452f':'#1c1b1a')+'" stroke="'+(hit?'#fb452f':'#55514b')+'" stroke-width="1.5"/>'}).join('')+
      '<circle cx="'+xs[0]+'" cy="'+ys[0]+'" r="3" fill="#fb452f"/>'+
      '<circle cx="'+xs[3]+'" cy="'+ys[3]+'" r="5" fill="'+(phase>3?'#fb452f':'#1c1b1a')+'" stroke="#fb452f" stroke-width="1.5"/>'+
      (phase>3?'':
        '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="6" fill="#fb452f" stroke="#1c1b1a" stroke-width="2.5"/>'+
        '<text x="'+lx+'" y="'+(c[1]-14)+'" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" font-weight="500" fill="#f4f1ec">You’re here</text>')+
      '</svg>';
  }
  draw();
  var t; window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(draw,60)});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
